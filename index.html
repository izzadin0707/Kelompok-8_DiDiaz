<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" ></script>
    <script src="helper.js"></script>
    <title>DiDiaz</title>
</head>
<body>

        <div id="sidebar" class="z-2 position-fixed"></div>

        <div id="main-wrapper" class="z-1">
            <div id="navbar" class="position-sticky top-0"></div>
            <main id="content">
                <!-- Konten akan muncul disini -->
            </main>
        </div>

<script>
    if (!isLoggedIn()) {
        location.href = "auth";
    }

    const user = Session.get("login") || JSON.parse(localStorage.getItem("login"));

    $("#navbar").load("components/navbar.html", function() {
        $("#welcome-message").text(`Selamat Datang ${user.name}!`);
    });
    $("#sidebar").load("components/sidebar.html", function () {
        $("#main-wrapper").css("margin-left", $("#sidebar > div").outerWidth());
    });

    const currentPage = location.hash.substring(2);

    if (currentPage) {
        loadPage(currentPage);
    } else {
        loadPage("home");
    }

    window.addEventListener("hashchange", router);
</script>
</body>
</html>
