<div class="d-flex justify-content-center m-2 p-2">

    <div class="d-flex flex-column align-items-center">
        <img src="../assets/Logo.svg" alt="Logo DiDiaz" style="width: 180px;">
        <div>
            <h3 class="text-purple fw-bold mb-3">Masuk</h3>
            <form id="loginForm" class="text-purple" style="width: 380px;">

                <div class="mb-3">
                    <input type="email" class="form-control fw-semibold py-2" id="email" placeholder="Email">
                </div>

                <div class="mb-3 position-relative">
                    <i class="bx bx-eye position-absolute fs-5" style="top: 50%; right: 12px; transform: translateY(-50%); cursor: pointer;" onclick="showPassword(this)"></i>
                    <input type="password" class="form-control fw-semibold py-2" id="password" placeholder="Password">
                </div>

                <div class="mb-3 d-flex justify-content-between align-items-center">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                        <label class="form-check-label fw-semibold" for="checkDefault">Remember me</label>
                    </div>
                    <span class="fw-semibold text-decoration-underline cursor-pointer">Lupa Password?</span>
                </div>
                
                <button type="submit" class="btn btn-primary py-2 w-100 rounded-3 fw-semibold mb-3">Masuk</button>

                <div class="d-flex flex-row justify-content-center align-items-center gap-3 mb-3">
                    <div class="w-100" style="border-top: 1.5px solid #6c757d;"></div>
                    <span class="fw-semibold text-secondary">atau</span>
                    <div class="w-100" style="border-top: 1.5px solid #6c757d;"></div>
                </div>

                <button class="btn btn-outline-primary py-2 w-100 rounded-3 fw-semibold mb-3">
                    <i class="bi bi-google me-2"></i>
                    Masuk dengan Google
                </button>
                
                <div class="w-100 text-center mb-3">
                    <span class="fw-semibold text-secondary">Belum punya akun? <span onclick="navigate('register')" class="text-purple text-decoration-underline cursor-pointer">Ayo daftar</span></span>
                </div>
            </form>
        </div>
        <div class="w-100 text-center text-purple">
            <span class="fw-semibold" style="font-size: .8rem;">Dengan melakukan login, Anda setuju dengan <span class="text-decoration-underline cursor-pointer">syarat & ketentuan DiDiaz.</span></span>
        </div>
    </div>

</div>
