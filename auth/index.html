<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" ></script>
    <script src="../helper.js"></script>
    <title>DiDiaz</title>
</head>
<body>

    <main id="content">
        <!-- Konten akan muncul disini -->
    </main>

<style>
    form .form-control {
        border: solid 1px #360049;
        border-radius: 10px;
    }

    form .form-control::placeholder {
        color: #360049;
        opacity: 0.5;
    }

    form .form-control:focus {
        border: solid 1px #360049;
        box-shadow: 0 0 0 2px rgba(54, 0, 73, 0.3);
    }

    form .form-check-input {
        border: solid 1px #360049;
        box-shadow: none;
        width: 18px;
        height: 18px;
    }

    form .form-check-input:checked {
        background-color: #360049;
        border-color: #360049;
        box-shadow: none;
    }
    
    form .form-check-input:focus {
        border: solid 1px #360049;
        box-shadow: 0 0 0 2px rgba(54, 0, 73, 0.3);
    }
</style>

<script>
    const currentPage = location.hash.substring(2);

    if (currentPage) {
        loadAuth(currentPage);
    } else {
        location.hash = "/login";
    }

    window.addEventListener("hashchange", function() {
        const page = location.hash.substring(2);

        if (!page || page.trim() === "") {
            location.hash = "/login";
            return;
        }

        loadAuth(page);
    });

    function loadAuth(page) {
        $("#content").animate({ opacity: 0 }, 100, function () {
            $(this).load(`./${page}/index.html`, function (response, status) {
                if (status === "error") {
                    $(this).load("./404/index.html");
                }
            });
            $(this).delay(100).animate({ opacity: 1 }, 100);
        });
    }

    function showPassword(element) {
        const passwordInput = $(element).siblings("input[type='password'], input[type='text']");
        const isPassword = passwordInput.attr("type") === "password";

        if (isPassword) {
            passwordInput.attr("type", "text");
            $(element).removeClass("bx-eye").addClass("bx-eye-slash");
        } else {
            passwordInput.attr("type", "password");
            $(element).removeClass("bx-eye-slash").addClass("bx-eye");
        }
    }
</script>
</body>
</html>
