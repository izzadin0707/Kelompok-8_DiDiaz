<div class="d-flex justify-content-center m-2 p-2">

    <div class="d-flex flex-column align-items-center">
        <img src="../assets/Logo.svg" alt="Logo DiDiaz" style="width: 180px;">
        <div>
            <h3 class="text-purple fw-bold mb-3">Daftar Akun DiDiaz</h3>
            <form id="loginForm" class="text-purple" style="width: 380px;">

                <div class="mb-3">
                    <input type="text" class="form-control fw-semibold py-2" id="name" placeholder="Nama Lengkap">
                </div>

                <div class="mb-3">
                    <input type="email" class="form-control fw-semibold py-2" id="email" placeholder="Alamat Email">
                </div>

                <div class="mb-3 position-relative">
                    <i class="bx bx-eye position-absolute fs-5" style="top: 50%; right: 12px; transform: translateY(-50%); cursor: pointer;" onclick="showPassword(this)"></i>
                    <input type="password" class="form-control fw-semibold py-2" id="password" placeholder="Masukan Password">
                </div>

                <div class="mb-3 position-relative">
                    <i class="bx bx-eye position-absolute fs-5" style="top: 50%; right: 12px; transform: translateY(-50%); cursor: pointer;" onclick="showPassword(this)"></i>
                    <input type="password" class="form-control fw-semibold py-2" id="confirmPassword" placeholder="Konfirmasi Password">
                </div>
                
                <button type="submit" class="btn btn-primary py-2 w-100 rounded-3 fw-semibold mb-3">Daftar</button>

                <div class="d-flex flex-row justify-content-center align-items-center gap-3 mb-3">
                    <div class="w-100" style="border-top: 1.5px solid #6c757d;"></div>
                    <span class="fw-semibold text-secondary">atau</span>
                    <div class="w-100" style="border-top: 1.5px solid #6c757d;"></div>
                </div>

                <button class="btn btn-outline-primary py-2 w-100 rounded-3 fw-semibold mb-3">
                    <i class="bi bi-google me-2"></i>
                    Daftar dengan Google
                </button>
                
                <div class="w-100 text-center mb-3">
                    <span class="fw-semibold text-secondary">Sudah punya akun? <span onclick="navigate('login')" class="text-purple text-decoration-underline cursor-pointer">Masuk di sini</span></span>
                </div>
            </form>
        </div>
        <div class="w-100 text-center text-purple">
            <span class="fw-semibold" style="font-size: .8rem;">Dengan melakukan pendaftaran, Anda setuju dengan <span class="text-decoration-underline cursor-pointer">syarat & ketentuan DiDiaz.</span></span>
        </div>
    </div>

</div>
