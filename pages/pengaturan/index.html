<div class="container my-4 px-5">

    <div class="d-flex flex-row justify-content-between align-items-center flex-wrap gap-3 mb-4">

        <div>

            <h1 class="fw-bold text-purple mb-1">
                Pengaturan
            </h1>

            <span class="text-secondary">
                Sesuaikan preferensi akun dan keamanan Anda.
            </span>

        </div>

        <button class="btn btn-primary fw-semibold">
            Simpan Perubahan
        </button>

    </div>

    <div class="row g-4">

        <div class="col-12 col-lg-6">

            <div class="bg-purple rounded-3 p-4 text-white h-100">

                <h5 class="fw-bold mb-4">
                    Informasi Akun
                </h5>

                <div class="d-flex flex-column gap-3">

                    <div>

                        <label class="form-label fw-semibold">
                            Nama Lengkap
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Masukkan nama lengkap"
                        >

                    </div>

                    <div>

                        <label class="form-label fw-semibold">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            placeholder="Masukkan email"
                        >

                    </div>

                    <div>

                        <label class="form-label fw-semibold">
                            Nomor Telepon
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Masukkan nomor telepon"
                        >

                    </div>

                </div>

            </div>

        </div>
        
        <div class="col-12 col-lg-6">

            <div class="bg-purple rounded-3 p-4 text-white h-100">

                <h5 class="fw-bold mb-4">
                    Keamanan Akun
                </h5>

                <div class="d-flex flex-column gap-3 mb-4">

                    <div>

                        <label class="form-label fw-semibold">
                            Password Lama
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            placeholder="Masukkan password lama"
                        >

                    </div>

                    <div>

                        <label class="form-label fw-semibold">
                            Password Baru
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            placeholder="Masukkan password baru"
                        >

                    </div>

                    <div>

                        <label class="form-label fw-semibold">
                            Konfirmasi Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            placeholder="Konfirmasi password baru"
                        >

                    </div>

                </div>

                <div class="bg-white rounded-3 p-3 text-purple d-flex justify-content-between align-items-center flex-wrap gap-3">

                    <div>

                        <h6 class="fw-bold mb-1">
                            Notifikasi Email
                        </h6>

                        <span>
                            Aktifkan notifikasi pembelajaran terbaru.
                        </span>

                    </div>

                    <div class="form-check form-switch">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            checked
                        >

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
